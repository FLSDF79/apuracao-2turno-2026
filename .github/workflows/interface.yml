# Testes da interface do painel (JavaScript puro, sem dependências).
name: Interface

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes da interface
        run: node --test tests/interface/*.test.js
